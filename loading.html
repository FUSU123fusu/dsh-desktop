<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>dsh 启动中</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0f1115; color: #c9d1d9;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .box { text-align: center; max-width: 560px; padding: 24px; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 18px;
    border: 3px solid #30363d; border-top-color: #58a6ff;
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 13px; color: #8b949e; margin: 4px 0; }
  pre {
    display: none; text-align: left; white-space: pre-wrap;
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    padding: 12px; font-size: 12px; color: #f85149; margin-top: 16px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">正在启动 dsh…</h1>
    <p id="hint">正在拉起本地 <code>dsh web</code> 服务，首次启动可能需要十几秒。</p>
    <pre id="err"></pre>
  </div>
  <script>
    window.showError = (msg) => {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("title").textContent = "启动失败";
      const pre = document.getElementById("err");
      pre.style.display = "block";
      pre.textContent = msg;
    };
    window.showSlow = () => {
      document.getElementById("title").textContent = "仍在启动中…";
      document.getElementById("hint").textContent =
        "这次启动比较慢（通常是杀毒软件在扫描首次运行的文件），不用动，界面出来会自动切换。";
    };
  </script>
</body>
</html>
